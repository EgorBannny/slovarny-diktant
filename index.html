<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Словарный диктант</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Marck+Script&family=Gentium+Plus&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F9FF; --grid:#D6E2F4; --card:#FFFFFF;
  --ink:#22308F; --pencil:#6F7686; --text:#1A1E2B;
  --margin:#E2574A; --line:#C3D0E6;
  --ok:#16744C; --ok-bg:#DDF3E8; --bad:#B3302A; --bad-bg:#FBE4E1;
  --btn-text:#FFFFFF;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121828; --grid:#1C2740; --card:#1A2136;
    --ink:#A3B3FF; --pencil:#9AA2B6; --text:#E6E9F5;
    --margin:#D0503F; --line:#2E3A5C;
    --ok:#6FD8A4; --ok-bg:#12332A; --bad:#FF9088; --bad-bg:#3A1C1F;
    --btn-text:#0F1530;
  }
}
:root[data-theme="dark"]{
  --paper:#121828; --grid:#1C2740; --card:#1A2136;
  --ink:#A3B3FF; --pencil:#9AA2B6; --text:#E6E9F5;
  --margin:#D0503F; --line:#2E3A5C;
  --ok:#6FD8A4; --ok-bg:#12332A; --bad:#FF9088; --bad-bg:#3A1C1F;
  --btn-text:#0F1530;
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{
  margin:0;min-height:100%;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  color:var(--text);
  font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  font-size:17px;line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 100px 48px;position:relative}
.wrap::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.85}

.top{padding-top:22px}
.mark{
  font-family:"Marck Script","Segoe Script","Bradley Hand",cursive;
  font-weight:400;font-size:clamp(2.3rem,8vw,3.3rem);line-height:1.05;
  color:var(--ink);margin:0;
}
.sub{margin:4px 0 0;color:var(--pencil);font-size:.95rem}

.tabs{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;gap:4px;margin:14px 0 20px;
  background:var(--paper);border-bottom:1.5px solid var(--line);
}
.tab{
  font:inherit;font-weight:600;color:var(--pencil);background:transparent;border:0;
  padding:12px 12px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;
}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.link:focus-visible,.card:focus-visible,.gcard:focus-visible{outline:3px solid var(--margin);outline-offset:2px}

h2{font-size:1.25rem;margin:0 0 10px;color:var(--text)}
.note{color:var(--pencil);font-size:.92rem;margin:8px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* search & mode row */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools input,.tools select{
  font:inherit;color:var(--text);background:var(--card);
  border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;min-width:0;
}
.tools input{flex:1 1 220px}
.tools input:focus-visible,.tools select:focus-visible{outline:3px solid var(--margin);outline-offset:1px}

/* breadcrumbs */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 16px;font-size:.98rem}
.crumbs button{font:inherit;font-weight:600;color:var(--ink);background:none;border:0;padding:4px 2px;text-decoration:underline;cursor:pointer}
.crumbs span.sep{color:var(--pencil)}
.crumbs span.here{font-weight:600;color:var(--text);padding:4px 2px}

/* group cards (sections / sets) */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:6px}
.gcard{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:16px 44px 14px 16px;cursor:default;-webkit-user-select:none;user-select:none;
  text-align:left;font:inherit;color:inherit;
}
.gcard .gtitle{font-weight:700;color:var(--ink);font-size:1.08rem;line-height:1.3}
.gcard .gsub{color:var(--pencil);font-size:.9rem;margin-top:4px}
.gcheck{position:absolute;top:12px;right:12px;width:24px;height:24px;cursor:pointer}
.gcheck input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.gcheck .box{position:absolute;inset:0;border:2px solid var(--line);border-radius:5px;background:var(--card);pointer-events:none}
.gcheck input:checked+.box{background:var(--ink);border-color:var(--ink)}
.gcheck input:checked+.box::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--btn-text);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.gcheck input:indeterminate+.box{background:var(--ink);border-color:var(--ink);opacity:.55}
.gcheck input:focus-visible+.box{outline:3px solid var(--margin);outline-offset:2px}

/* word cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 44px 12px 14px}
.card.weak{border-left:4px solid var(--bad)}
.card .tag{color:var(--pencil);font-size:.78rem;margin-bottom:4px}
.card .en{font-weight:700;font-size:1.2rem;line-height:1.25;color:var(--ink);overflow-wrap:anywhere}
.card .ipa{font-family:"Gentium Plus","Noto Serif","DejaVu Serif",serif;color:var(--pencil);font-size:1.05rem;margin-top:2px;overflow-wrap:anywhere}
.card .ru{margin-top:6px;overflow-wrap:anywhere}
.study .card{cursor:pointer}
.study-ru .card:not(.open) .ru,
.study-en .card:not(.open) .en,
.study-en .card:not(.open) .ipa{color:transparent;text-shadow:0 0 10px var(--text);user-select:none}
.empty{color:var(--pencil);padding:20px 0}

/* audio + senses/examples */
.enrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spk{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:.95rem;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.spk:hover{border-color:var(--ink)}
.study-en .card:not(.open) .spk{visibility:hidden;pointer-events:none}
.detailsToggle{display:block;margin-top:10px;font:inherit;font-size:.85rem;font-weight:600;
  color:var(--ink);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.detailsBody{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.defbox{background:var(--paper);border-left:3px solid var(--ink);border-radius:4px;padding:8px 10px;margin-bottom:8px}
.deflabel{font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pencil);margin-top:6px}
.deflabel:first-child{margin-top:0}
.deftext{font-size:.93rem;overflow-wrap:anywhere}
.sense{font-size:.92rem;margin:0 0 6px}
.sru{font-weight:600;color:var(--text)}
.snote{display:block;color:var(--pencil);font-size:.84rem;margin-top:1px}
.examples{margin-top:8px;display:grid;gap:8px}
.example{background:var(--paper);border-radius:6px;padding:8px 10px}
.exen{font-style:italic;color:var(--text);overflow-wrap:anywhere}
.exru{color:var(--pencil);font-size:.9rem;margin-top:3px;overflow-wrap:anywhere}

/* multiple choice */
.choices{display:grid;gap:10px;margin-top:4px}
.choiceBtn{font:inherit;font-size:1.05rem;text-align:left;padding:12px 16px;border:2px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
.choiceBtn:hover{border-color:var(--ink)}
.choiceBtn:focus-visible{outline:3px solid var(--margin);outline-offset:2px}

/* cloze */
.prompt.cloze{font-size:clamp(1.1rem,4.2vw,1.5rem);font-weight:500}
.blank{display:inline-block;border-bottom:3px solid var(--ink);min-width:4em;height:1em;vertical-align:text-bottom}
.clozeru{color:var(--pencil);font-size:.95rem;margin:-10px 0 18px}

/* buttons, chips */
.btn{
  font:inherit;font-weight:600;color:var(--ink);background:transparent;
  border:2px solid var(--ink);border-radius:6px;padding:10px 18px;cursor:pointer;
}
.btn.primary{background:var(--ink);color:var(--btn-text)}
.btn:disabled{opacity:.5;cursor:default}
.link{font:inherit;color:var(--pencil);background:none;border:0;padding:6px 0;text-decoration:underline;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
fieldset{border:0;margin:0 0 16px;padding:0}
legend{padding:0;margin-bottom:8px;font-weight:600}
.chip{position:relative;display:inline-block;margin:0 6px 8px 0}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 14px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
.chip input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--btn-text)}
.chip input:focus-visible+span{outline:3px solid var(--margin);outline-offset:2px}
.chip input:disabled+span{opacity:.45}
.srcchip span small{display:block;font-weight:400;font-size:.82rem;opacity:.85;margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px;cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--ink)}

/* selection bar */
.selbar{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  background:var(--ink);color:var(--btn-text);padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -4px 14px rgba(0,0,0,.18);
}
.selbar span{font-weight:600}
.selbar .btn{border-color:var(--btn-text);color:var(--btn-text)}
.selbar .btn.primary{background:var(--btn-text);color:var(--ink)}
.selbar .link{color:var(--btn-text);opacity:.85}

/* dictation */
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px}
.prog{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.95rem;color:var(--pencil);margin-bottom:6px}
.bar{height:5px;background:var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.dirlabel{margin:0;color:var(--pencil);font-size:.95rem}
.prompt{font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;line-height:1.2;color:var(--ink);margin:6px 0 18px;overflow-wrap:anywhere}
.answer{
  width:100%;font:inherit;font-size:1.35rem;color:var(--text);
  background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;
  padding:8px 2px;outline:none;
}
.answer:focus-visible{border-bottom-color:var(--margin);box-shadow:0 2px 0 var(--margin)}
.verdict{display:inline-block;font-weight:700;font-size:1.15rem;padding:5px 12px;border-radius:6px;margin-bottom:14px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.cmp{margin:14px 0 4px;font-size:1.08rem}
.cmp div{margin:4px 0;overflow-wrap:anywhere}
.cmp b{display:inline-block;min-width:6.2em;color:var(--pencil);font-weight:500}
mark{background:none;color:inherit;white-space:pre}
mark.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
mark.miss{background:var(--ok-bg);color:var(--ok);font-weight:700}
.final{text-align:center;padding:10px 0 6px}
.grade{
  font-family:"Marck Script","Segoe Script","Bradley Hand",cursive;
  font-size:clamp(7rem,32vw,10rem);line-height:1;color:var(--margin);
  display:inline-block;transform:rotate(-7deg);margin:6px 0 0;
}
.gradeword{font-size:1.2rem;font-weight:600;margin:0}
.misses{margin-top:22px;display:grid;gap:12px}
.miss-item .said{font-size:.95rem;color:var(--pencil);margin:0 0 6px}
.srcbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}

@media (max-width:420px){
  .wrap{padding-left:40px;padding-right:14px}
  .wrap::before{left:22px}
  .panel{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="mark">Словарный диктант</h1>
    <p class="sub" id="subline"></p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab on" role="tab" id="t-cards" data-tab="cards" aria-selected="true" aria-controls="tab-cards">Карточки</button>
    <button class="tab" role="tab" id="t-test" data-tab="test" aria-selected="false" aria-controls="tab-test">Диктант</button>
  </nav>

  <main>
    <section id="tab-cards" role="tabpanel" aria-labelledby="t-cards">
      <div class="tools">
        <label class="sr" for="q">Поиск по всем словам</label>
        <input id="q" type="search" placeholder="Поиск: слово или перевод" autocomplete="off">
        <label class="sr" for="mode">Что показывать</label>
        <select id="mode">
          <option value="all">Показывать всё</option>
          <option value="hide-ru">Скрыть русский</option>
          <option value="hide-en">Скрыть английский</option>
        </select>
      </div>
      <nav class="crumbs" id="crumbs" aria-label="Хлебные крошки"></nav>
      <p class="note" id="cardsNote"></p>
      <div id="cardsArea"></div>
    </section>

    <section id="tab-test" role="tabpanel" aria-labelledby="t-test" hidden>
      <div id="dictation"></div>
    </section>
  </main>
</div>

<div class="selbar" id="selBar" hidden>
  <span id="selCount"></span>
  <button class="link" id="selClear" type="button">Очистить</button>
  <button class="btn primary" id="selGo" type="button">Диктант по выбранному</button>
</div>

<script>
(function(){
'use strict';

/* ---------- Данные: разделы → наборы → слова ---------- */
var idSeq=0;
function W(en,ipa,ru,extra){
  var w={id:++idSeq,en:en,ipa:ipa,ru:ru};
  if(extra) for(var k in extra) w[k]=extra[k];
  return w;
}
var SECTIONS=[
{id:'basics',title:'Основы английского',sets:[
   {id:'pronouns',title:'Местоимения',words:[
     W('I','[aɪ]','я',{examples:[
       {en:"I am a student at this college.",ru:"Я студент этого колледжа."},
       {en:"I study English every day.",ru:"Я учу английский каждый день."}
     ]}),
     W('you','[juː]','ты; вы',{senses:[
       {ru:'ты (ед. ч.)',note:'для одного человека'},
       {ru:'вы (мн. ч. или вежливо)',note:'для нескольких людей или вежливого обращения'}
     ],examples:[
       {en:"You are my best friend.",ru:"Ты мой лучший друг."},
       {en:"Can you help me, please?",ru:"Вы можете мне помочь, пожалуйста?"}
     ]}),
     W('he','[hiː]','он',{examples:[
       {en:"He works in the IT department.",ru:"Он работает в IT-отделе."},
       {en:"He is my brother.",ru:"Он мой брат."}
     ]}),
     W('she','[ʃiː]','она',{examples:[
       {en:"She speaks three languages.",ru:"Она говорит на трёх языках."},
       {en:"She is a programmer.",ru:"Она программист."}
     ]}),
     W('it','[ɪt]','он, она, оно (о неодушевлённых предметах и животных)',{senses:[
       {ru:'это (в безличных предложениях)',note:"It is cold today. — Сегодня холодно."}
     ],examples:[
       {en:"It is a very fast computer.",ru:"Это очень быстрый компьютер."},
       {en:"It is raining outside.",ru:"На улице идёт дождь."}
     ]}),
     W('we','[wiː]','мы',{examples:[
       {en:"We are learning English grammar.",ru:"Мы учим английскую грамматику."},
       {en:"We live in the same city.",ru:"Мы живём в одном городе."}
     ]}),
     W('they','[ðeɪ]','они',{examples:[
       {en:"They work in a big office.",ru:"Они работают в большом офисе."},
       {en:"They are my friends.",ru:"Они мои друзья."}
     ]}),
     W('me','[miː]','меня, мне, мной',{examples:[
       {en:"Please give me the book.",ru:"Пожалуйста, дай мне книгу."},
       {en:"She called me yesterday.",ru:"Она позвонила мне вчера."}
     ]}),
     W('him','[hɪm]','его, ему, им',{examples:[
       {en:"I saw him at the lecture.",ru:"Я видел его на лекции."},
       {en:"Give him the file, please.",ru:"Дай ему файл, пожалуйста."}
     ]}),
     W('her','[hɜː]','её, ей',{senses:[
       {ru:'её (притяжательное)',note:"her book — её книга"}
     ],examples:[
       {en:"I know her very well.",ru:"Я знаю её очень хорошо."},
       {en:"Please help her with the task.",ru:"Пожалуйста, помоги ей с задачей."}
     ]}),
     W('us','[ʌs]','нас, нам, нами',{examples:[
       {en:"Can you help us?",ru:"Ты можешь нам помочь?"},
       {en:"The teacher explained the rule to us.",ru:"Учитель объяснил нам правило."}
     ]}),
     W('them','[ðem]','их, им',{examples:[
       {en:"I saw them in the library.",ru:"Я видел их в библиотеке."},
       {en:"Please give them these documents.",ru:"Пожалуйста, дай им эти документы."}
     ]}),
     W('my','[maɪ]','мой',{examples:[
       {en:"This is my computer.",ru:"Это мой компьютер."},
       {en:"My name is Anna.",ru:"Меня зовут Анна."}
     ]}),
     W('your','[jɔː]','твой; ваш',{examples:[
       {en:"Is this your pen?",ru:"Это твоя ручка?"},
       {en:"Your project is very good.",ru:"Твой проект очень хороший."}
     ]}),
     W('his','[hɪz]','его (притяжательное)',{examples:[
       {en:"His laptop is very fast.",ru:"Его ноутбук очень быстрый."},
       {en:"I like his idea.",ru:"Мне нравится его идея."}
     ]}),
     W('its','[ɪts]','его, её (о неодушевлённых предметах)',{note:'Не путай с it\'s = it is.',examples:[
       {en:"The company changed its name.",ru:"Компания изменила своё название."},
       {en:"The computer updated its software.",ru:"Компьютер обновил своё программное обеспечение."}
     ]}),
     W('our','[ˈaʊə]','наш',{examples:[
       {en:"Our group has ten students.",ru:"В нашей группе десять студентов."},
       {en:"This is our classroom.",ru:"Это наш класс."}
     ]}),
     W('their','[ðeə]','их (притяжательное)',{examples:[
       {en:"Their teacher is very strict.",ru:"Их учитель очень строгий."},
       {en:"The students do their homework every day.",ru:"Студенты делают свою домашнюю работу каждый день."}
     ]}),
     W('mine','[maɪn]','мой (без существительного)',{examples:[
       {en:"This book is mine.",ru:"Эта книга моя."},
       {en:"That laptop is mine, not yours.",ru:"Тот ноутбук мой, а не твой."}
     ]}),
     W('yours','[jɔːz]','твой; ваш (без существительного)',{examples:[
       {en:"Is this pen yours?",ru:"Эта ручка твоя?"},
       {en:"My answer is different from yours.",ru:"Мой ответ отличается от твоего."}
     ]}),
     W('his','[hɪz]','его (без существительного)',{senses:[
       {ru:'его (притяжательное, перед существительным)',note:"his book — его книга"}
     ],examples:[
       {en:"This car is his.",ru:"Эта машина его."},
       {en:"His is the best answer.",ru:"Его ответ — лучший."}
     ]}),
     W('hers','[hɜːz]','её (без существительного)',{examples:[
       {en:"The red bag is hers.",ru:"Красная сумка — её."},
       {en:"My idea is better than hers.",ru:"Моя идея лучше, чем её."}
     ]}),
     W('ours','[ˈaʊəz]','наш (без существительного)',{examples:[
       {en:"This room is ours.",ru:"Эта комната наша."},
       {en:"Their project is older than ours.",ru:"Их проект старше нашего."}
     ]}),
     W('theirs','[ðeəz]','их (без существительного)',{examples:[

 {id:"college",title:"Колледж",sets:[
   {id:"basics",title:"Основные понятия",words:[
     W("vocabulary","[vəˈkæbjələri]","словарь",{def:"Словарь: набор слов с их значениями; также запас слов, которые человек знает.",plain:"Vocabulary — это и список слов с переводами, и все слова, которые ты знаешь (или учишь). Именно словарный запас ты сейчас и тренируешь.",ruAcc:["словарь", "словарный запас"],senses:[{ru:"словарный запас",note:"чаще всего vocabulary означает именно запас слов человека или языка"}],examples:[{en:"My vocabulary grows every week.",ru:"Мой словарный запас растёт каждую неделю."},{en:"This vocabulary list has fifty new words.",ru:"В этом списке словаря пятьдесят новых слов."}]}),
     W("information","[ˌɪnfəˈmeɪʃn]","информация (сведения)",{def:"Осмысленные, обработанные данные, на основе которых принимают решения.",plain:"Данные сами по себе — просто факты. Когда их обработали и поняли, получается информация, с помощью которой можно принять решение. Список оценок — это данные, а вывод «группа готова к экзамену» — информация.",note:"Слово information не имеет множественного числа. В тетради: «сведения».",ruAcc:["информация", "сведения", "информация (сведения)"],examples:[{en:"The manager needs the right information to make a good decision.",ru:"Руководителю нужна точная информация, чтобы принять хорошее решение."},{en:"This information is stored in the database.",ru:"Эта информация хранится в базе данных."}]}),
     W("data","[ˈdeɪtə]","данные",{def:"Необработанные факты, числа, тексты, изображения. Классификации: по структуре (структурированные, полуструктурированные, неструктурированные), по характеру (количественные, качественные), по источнику (первичные, вторичные), по форме (числовые, текстовые, графические, аудио/видео).",plain:"Сырой материал: числа, слова, даты, картинки, которые записаны и хранятся. Фамилия студента или его дата рождения — это данные. Когда их обработали и осмыслили, они становятся информацией.",note:"В тетради: чтение и множественное число — см. в грамматике.",senses:[{ru:"единственное число — datum",note:"a datum — одна единица данных; в повседневной речи почти не встречается"}],examples:[{en:"The program reads the data from a file.",ru:"Программа считывает данные из файла."},{en:"The data is stored in a table.",ru:"Данные хранятся в таблице."}]}),
     W("data item","[ˈdeɪtə ˈaɪtəm]","элемент данных",{def:"Наименьшая именованная единица данных, например «возраст».",plain:"Самая мелкая «кирпичинка» данных, у которой есть своё имя: «возраст», «фамилия», «дата рождения». Значения таких элементов хранятся в полях таблицы.",examples:[{en:"Age is a data item of every student record.",ru:"Возраст — это элемент данных в записи каждого студента."},{en:"Each data item has its own name and type.",ru:"У каждого элемента данных есть своё имя и тип."}]}),
     W("DB (database)","[ˌdiː ˈbiː] [ˈdeɪtəbeɪs]","база данных (БД)",{def:"Организованная совокупность данных с быстрым поиском и изменением; хранится в компьютере (хранение взаимосвязанной информации в электронной форме).",plain:"«Электронный шкаф», в котором данные разложены по порядку и связаны между собой, поэтому нужное быстро находится и меняется. Пример: список студентов колледжа, их оценки и расписание.",note:"DB (5) и Database (6) на слайдах — одно и то же. Сокращения DB, db и БД тоже.",enAcc:["DB (database)", "DB", "db", "database"],ruAcc:["база данных", "БД", "база данных (БД)"],examples:[{en:"The college keeps all its student records in one database.",ru:"Колледж хранит все данные о студентах в одной базе данных."},{en:"A database can be very large, but the search is still fast.",ru:"База данных может быть очень большой, но поиск всё равно быстрый."}]}),
     W("dataset","[ˈdeɪtəset]","набор данных",{def:"Связанная совокупность данных (таблица, файл), собранная для одной цели.",plain:"Один «комплект» данных под одну задачу, например таблица с оценками группы или файл с результатами опроса. В отличие от базы данных, это обычно одна таблица или один файл.",examples:[{en:"A dataset with the test results is saved in one file.",ru:"Набор данных с результатами теста сохранён в одном файле."},{en:"This dataset was collected for one purpose only.",ru:"Этот набор данных собрали только для одной цели."}]}),
     W("data communication","[ˈdeɪtə kəˌmjuːnɪˈkeɪʃn]","обмен данными",{def:"Передача данных между устройствами по каналам связи (например, по сети или интернету).",plain:"Так компьютеры «разговаривают» друг с другом: один отправляет данные, другой принимает. Когда ты открываешь сайт, твой компьютер и сервер обмениваются данными по сети.",examples:[{en:"Data communication between two computers needs a network.",ru:"Для обмена данными между двумя компьютерами нужна сеть."},{en:"Data communication is slow when the network is busy.",ru:"Обмен данными идёт медленно, когда сеть перегружена."}]}),
     W("DB administrator","[ˌdiː ˈbiː ədˈmɪnɪstreɪtə]","администратор БД",{def:"Специалист, который отвечает за настройку, безопасность, резервные копии и доступ к БД.",plain:"Человек, который «следит за порядком» в базе данных: настраивает её, защищает от посторонних, делает копии на случай сбоя и решает, кто что может смотреть и менять. Сокращённо — «админ БД».",ruAcc:["администратор БД", "БД админ", "БД админ.", "админ БД", "администратор базы данных"],examples:[{en:"The DB administrator makes a backup every night.",ru:"Администратор БД делает резервную копию каждую ночь."},{en:"Ask the DB administrator for permission to open this table.",ru:"Попроси у администратора БД разрешение открыть эту таблицу."}]}),
     W("DB engine","[ˌdiː ˈbiː ˈendʒɪn]","механизм БД",{def:"Ядро СУБД — её основной компонент, отвечающий за хранение, обработку и доступ к данным; хранит данные и выполняет запросы.",plain:"«Мотор» базы данных. Когда ты отправляешь запрос, именно engine находит данные на диске, обрабатывает их и возвращает результат. Пользователь его не видит: он работает внутри СУБД.",ruAcc:["механизм БД", "механизм базы данных", "движок БД", "ядро БД"],senses:[{ru:"двигатель, мотор",note:"вне IT — двигатель автомобиля; в IT часто переводят как «движок» или «ядро»"}],examples:[{en:"The DB engine finds the data on the disk and returns the result.",ru:"Механизм БД находит данные на диске и возвращает результат."},{en:"A fast DB engine can handle a lot of queries at the same time.",ru:"Быстрый механизм БД справляется со множеством запросов одновременно."}]}),
     W("BDE (Borland Database Engine)","[ˌbiː diː ˈiː] [ˈbɔːlənd ˈdeɪtəbeɪs ˈendʒɪn]","механизм БД Borland",{def:"Механизм БД Borland (калька). Устаревшая библиотека доступа к БД в Delphi и C++ Builder. Её заменили dbExpress и FireDAC.",plain:"Старый «переходник» между программой на Delphi или C++ Builder и базой данных: программа обращалась к данным через BDE. Сейчас им почти не пользуются — на смену пришли dbExpress и FireDAC.",note:"«Калька» — название переведено с английского слово в слово.",ruAcc:["механизм БД Borland", "механизм баз данных Borland", "Borland Database Engine"],examples:[{en:"The old program uses BDE to open the database.",ru:"Старая программа использует BDE, чтобы открыть базу данных."},{en:"BDE is old, so new programs use other tools.",ru:"BDE устарела, поэтому новые программы используют другие инструменты."}]}),
     W("DB server","[ˌdiː ˈbiː ˈsɜːvə]","сервер БД",{def:"Компьютер или программа, хранящая БД и обрабатывающая запросы к ней (от пользователей и приложений).",plain:"«Хозяин» базы данных. Приложение или пользователь отправляет запрос, сервер ищет ответ и присылает его обратно. Сервером может быть отдельный мощный компьютер или программа на обычном.",note:"В тетради также: «обслуживающий БД».",ruAcc:["сервер БД", "обслуживающий БД", "сервер базы данных", "сервер, обслуживающий БД"],examples:[{en:"The application sends a query to the DB server.",ru:"Приложение отправляет запрос серверу БД."},{en:"The DB server stores the database and answers all the queries.",ru:"Сервер БД хранит базу данных и отвечает на все запросы."}]}),
     W("RDBS (remote database system)","[ˌɑː diː biː ˈes] [rɪˈməʊt ˈdeɪtəbeɪs ˈsɪstəm]","система удалённой БД",{def:"Система удалённой БД. Позволяет работать с БД на другом компьютере через сеть, без физического доступа к самому серверу.",plain:"Способ «подключиться издалека»: ты сидишь за своим компьютером, а база данных лежит на другом — на сервере в другом здании или городе. Через сеть ты читаешь и меняешь данные так, как будто они рядом.",note:"В тетради было «RDBC — СУБД (система удалённого доступа к БД)»; в списке — RDBS, remote database system.",ruAcc:["система удалённой БД", "система удалённого доступа к БД", "СУБД удалённого доступа"],examples:[{en:"With RDBS you can work with the database from another city.",ru:"С помощью RDBS можно работать с базой данных из другого города."},{en:"RDBS needs a network, but you do not need to touch the server.",ru:"RDBS нужна сеть, но трогать сам сервер не нужно."}]})
   ]},
   {id:"structure",title:"Структура БД",words:[
     W("layer","[ˈleɪə]","уровень (слой)",{def:"Уровень, слой. Часть архитектуры БД со своей функцией (хранение, логика, представление).",plain:"Представь многоэтажный дом: на каждом этаже своя задача. Нижний слой хранит данные на диске, средний решает, как данные устроены и связаны, верхний показывает их пользователю.",ruAcc:["уровень", "слой", "уровень БД", "уровень (слой)"],senses:[{ru:"слой, пласт (общее значение)",note:"вне IT — слой краски, слой земли"}],examples:[{en:"The lowest layer stores the data on the disk.",ru:"Нижний слой хранит данные на диске."},{en:"Each layer has its own task in the database.",ru:"У каждого слоя в базе данных своя задача."}]}),
     W("layer engine","[ˈleɪə ˈendʒɪn]","механизм управления уровнем БД",{def:"Механизм управления уровнем БД. Компонент, который выполняет функции отдельного уровня.",plain:"«Мотор» одного этажа. Если layer — этаж со своей задачей, то layer engine — программа, которая эту задачу выполняет: например, записывает данные на диск или проверяет их структуру.",examples:[{en:"Each layer engine controls only its own layer.",ru:"Каждый механизм уровня управляет только своим уровнем."},{en:"The layer engine of the lowest layer saves the data on the disk.",ru:"Механизм нижнего уровня сохраняет данные на диск."}]}),
     W("table","[ˈteɪbl]","таблица",{def:"Таблица. Данные в строках и столбцах; основная структура хранения данных в реляционной БД.",plain:"Как лист в тетради в клетку: по горизонтали — строки (записи), по вертикали — столбцы (поля). В одной таблице обычно хранят данные об одном виде объектов, например о студентах.",senses:[{ru:"стол",note:"вне IT — обычный стол, например a table in the kitchen"}],examples:[{en:"The table has five columns and ten rows.",ru:"В таблице пять столбцов и десять строк."},{en:"Each table in the database stores one kind of data.",ru:"Каждая таблица в базе данных хранит один вид данных."}]}),
     W("master table","[ˈmɑːstə ˈteɪbl]","главная таблица",{def:"Главная таблица. На её записи ссылаются подчинённые таблицы («Клиенты» для «Заказов»).",plain:"«Главный справочник». Таблица «Клиенты» главная, а «Заказы» подчинённая: каждый заказ указывает, какому клиенту он принадлежит.",senses:[{ru:"мастер, хозяин (общее значение)",note:"здесь — «главный, основной»"}],examples:[{en:"The table Customers is the master table for the table Orders.",ru:"Таблица «Клиенты» — главная для таблицы «Заказы»."},{en:"Other tables point to the records of the master table.",ru:"Другие таблицы ссылаются на записи главной таблицы."}]}),
     W("record","[ˈrekɔːd]","запись",{def:"Запись. Полный набор значений об одном объекте (например, все сведения об одном студенте).",plain:"Одна строка таблицы целиком. Если таблица — список группы, то запись — всё, что известно об одном человеке: фамилия, имя, дата рождения.",senses:[{ru:"рекорд; записывать (звук, видео)",note:"произношение другое: существительное [ˈrekɔːd], глагол [rɪˈkɔːd]"}],examples:[{en:"Each record in the table describes one student.",ru:"Каждая запись в таблице описывает одного студента."},{en:"Add a new record to the table when a new student comes.",ru:"Добавь в таблицу новую запись, когда приходит новый студент."}]}),
     W("field","[fiːld]","поле",{def:"Поле. Столбец таблицы с одним видом данных (например, «Фамилия» или «Дата рождения»).",plain:"Одна «графа» таблицы. Все значения в ней одного вида: в поле «Фамилия» — только фамилии, в поле «Дата рождения» — только даты. Запись состоит из значений полей.",senses:[{ru:"поле, луг",note:"вне IT — участок земли, например a football field"}],examples:[{en:"The field Name stores the name of the student.",ru:"Поле «Имя» хранит имя студента."},{en:"Every field in this table has its own type.",ru:"У каждого поля этой таблицы свой тип."}]}),
     W("row","[rəʊ]","ряд (строка)",{def:"Ряд, строка. Горизонтальная строка таблицы, соответствует записи.",plain:"Строка слева направо. Одна строка = одна запись: в ней лежат значения всех полей об одном объекте. Не путай со столбцом (column) — он идёт сверху вниз.",ruAcc:["ряд", "строка", "ряд (строка)"],senses:[{ru:"ссора (британский вариант)",note:"произносится иначе — [raʊ]"}],examples:[{en:"Each row of the table is one record.",ru:"Каждая строка таблицы — это одна запись."},{en:"Delete the last row if it is empty.",ru:"Удали последнюю строку, если она пустая."}]})
   ]},
   {id:"objects",title:"Объекты и технологии",words:[
     W("component","[kəmˈpəʊnənt]","компонент",{def:"Компонент. Готовый переиспользуемый модуль программы (кнопка, таблица в Delphi).",plain:"Как деталь конструктора: кнопку, поле ввода или таблицу не пишут с нуля — берут готовый компонент и ставят в программу.",senses:[{ru:"составная часть (общее значение)",note:"любая часть, из которых состоит целое"}],examples:[{en:"A button is a ready component that you can use in many programs.",ru:"Кнопка — готовый компонент, который можно использовать во многих программах."},{en:"Drag the component to the window and set it up.",ru:"Перетащи компонент в окно и настрой его."}]}),
     W("object","[ˈɒbdʒɪkt]","объект",{def:"Объект. Экземпляр класса с данными (поля) и действиями (методы).",plain:"Конкретная «вещь» в программе, созданная по чертежу (классу). Класс «Студент» — чертёж, а студент Иван — объект: у него есть данные (имя, возраст) и действия (методы).",senses:[{ru:"предмет; цель; возражать",note:"вне IT — предмет, цель; глагол to object [əbˈdʒekt] — возражать"}],examples:[{en:"Each object has its own data and its own methods.",ru:"У каждого объекта свои данные и свои методы."},{en:"The program creates a new object for every student.",ru:"Программа создаёт новый объект для каждого студента."}]}),
     W("class","[klɑːs]","класс",{def:"Класс. Шаблон для создания объектов.",plain:"Чертёж или форма для печенья: по одному классу можно создать много объектов. Класс описывает, какие у объектов будут поля и методы.",senses:[{ru:"школьный класс; разряд",note:"вне IT — учебный класс или категория, например first class"}],examples:[{en:"One class can create many objects.",ru:"Один класс может создать много объектов."},{en:"A class describes the data and methods of its objects.",ru:"Класс описывает данные и методы своих объектов."}]}),
     W("ADO (ActiveX Data Objects)","[ˌeɪ diː ˈəʊ] [ˈæktɪvˌeks ˈdeɪtə ˈɒbdʒɪkts]","объекты данных ActiveX",{def:"Объекты данных ActiveX (калька). Технология Microsoft для доступа к данным.",plain:"Набор готовых объектов от Microsoft, через которые программа подключается к базе данных, отправляет запросы и получает результаты.",note:"«Калька» — название переведено с английского слово в слово.",ruAcc:["объекты данных ActiveX", "ADO"],examples:[{en:"The program uses ADO to connect to the database.",ru:"Программа использует ADO, чтобы подключиться к базе данных."},{en:"ADO helps the application read and change data.",ru:"ADO помогает приложению читать и менять данные."}]}),
     W("OLE (Object Linking and Embedding)","[ˌəʊ el ˈiː] [ˈɒbdʒɪkt ˈlɪŋkɪŋ ənd ɪmˈbedɪŋ]","связывание и внедрение объектов",{def:"Связывание и внедрение объектов. Встраивание объектов одной программы в документ другой (таблица Excel в Word).",plain:"Позволяет положить в документ «кусочек» из другой программы: например, таблицу Excel внутри текста в Word. Объект можно либо встроить (он живёт в документе), либо связать с исходным файлом.",examples:[{en:"With OLE you can put an Excel table into a Word document.",ru:"С помощью OLE можно вставить таблицу Excel в документ Word."},{en:"OLE can embed an object into a document or link it to a file.",ru:"OLE умеет встраивать объект в документ или связывать его с файлом."}]}),
     W("API (Application Programming Interface)","[ˌeɪ piː ˈaɪ] [ˌæplɪˈkeɪʃn ˈprəʊɡræmɪŋ ˈɪntəfeɪs]","программный интерфейс приложения",{def:"Программный интерфейс приложения. Набор функций, через которые одна программа обращается к другой.",plain:"«Меню» функций, которые программа разрешает вызывать другим программам. Ты не знаешь, как всё устроено внутри, но знаешь, какую функцию вызвать и что получишь в ответ.",examples:[{en:"A program calls the API of another program to get its data.",ru:"Программа обращается к API другой программы, чтобы получить её данные."},{en:"The API has a function for every operation.",ru:"В API есть функция для каждой операции."}]}),
     W("cross platform","[ˌkrɒs ˈplætfɔːm]","кроссплатформенный",{def:"Кроссплатформенный (калька). Работающий на разных ОС.",plain:"Одна и та же программа запускается и в Windows, и в Linux, и на других системах, и её не нужно переписывать для каждой.",note:"«Калька» — слово переведено с английского дословно. Пишут и cross-platform.",enAcc:["cross platform", "cross-platform", "crossplatform"],examples:[{en:"This cross platform program works on Windows and Linux.",ru:"Эта кроссплатформенная программа работает в Windows и Linux."},{en:"A cross platform framework saves a lot of work.",ru:"Кроссплатформенный фреймворк экономит много работы."}]})
   ]},
   {id:"events",title:"Данные и события",words:[
     W("client dataset","[ˈklaɪənt ˈdeɪtəset]","клиентский набор данных",{def:"Клиентский набор данных. Хранится в памяти клиентского приложения и обрабатывается локально.",plain:"Копия данных, которую приложение держит у себя в памяти и обрабатывает само, не обращаясь каждый раз к серверу.",examples:[{en:"The client dataset keeps the data in the memory of the application.",ru:"Клиентский набор данных хранит данные в памяти приложения."},{en:"You can change a client dataset without a connection to the server.",ru:"Клиентский набор данных можно менять без связи с сервером."}]}),
     W("trigger","[ˈtrɪɡə]","триггер",{def:"Триггер. Процедура, автоматически срабатывающая при INSERT, UPDATE или DELETE.",plain:"«Сигнализация» в базе данных: стоит изменить запись — и сама собой запускается заготовленная процедура (например, записать это изменение в журнал).",note:"Слово trigger есть и в наборе IT как глагол («запускать, вызывать»); здесь — существительное, термин БД.",senses:[{ru:"спусковой крючок",note:"вне IT — курок, спусковой крючок"}],examples:[{en:"A trigger runs by itself when a record is changed.",ru:"Триггер запускается сам, когда запись изменяется."},{en:"This trigger writes every delete to the log.",ru:"Этот триггер записывает каждое удаление в журнал."}]}),
     W("log","[lɒɡ]","журнал (лог)",{def:"Журнал, лог. Файл с записью событий и операций.",plain:"Дневник программы: она записывает в него, что и когда произошло. Если что-то сломалось, в логе можно найти причину.",ruAcc:["журнал", "лог", "журнал (лог)"],senses:[{ru:"бревно; вести запись",note:"вне IT — бревно, полено; глагол to log — записывать в журнал"}],examples:[{en:"The program writes every error to the log.",ru:"Программа записывает каждую ошибку в журнал."},{en:"Check the log to find the cause of the failure.",ru:"Проверь журнал, чтобы найти причину сбоя."}]}),
     W("logging","[ˈlɒɡɪŋ]","журналирование (логирование)",{def:"Журналирование, логирование. Ведение такого журнала.",plain:"Сам процесс записи событий в лог: программа «ведёт дневник» всё время, пока работает.",note:"Слово logging есть и в наборе IT; здесь — в списке колледжа.",ruAcc:["журналирование", "логирование", "журналирование (логирование)"],examples:[{en:"Logging helps us find errors in the program.",ru:"Логирование помогает нам находить ошибки в программе."},{en:"Turn on logging before you start the test.",ru:"Включи логирование, прежде чем запускать тест."}]}),
     W("file locking","[faɪl ˈlɒkɪŋ]","блокировка файла",{def:"Блокировка файла. Запрет одновременного изменения файла несколькими пользователями.",plain:"Как табличка «занято» на двери: пока один пользователь меняет файл, остальным нельзя его менять, чтобы они не затёрли чужие изменения.",examples:[{en:"File locking stops two users from changing the same file.",ru:"Блокировка файла не позволяет двум пользователям менять один и тот же файл."},{en:"Without file locking, the data can be lost.",ru:"Без блокировки файла данные могут быть потеряны."}]}),
     W("data source","[ˈdeɪtə sɔːs]","источник данных",{def:"Источник данных. Откуда приложение берёт данные (БД, файл, сервис).",plain:"Место, откуда программа получает данные: это может быть база данных, обычный файл или какая-то служба в интернете.",examples:[{en:"The application can use a file or a database as a data source.",ru:"Приложение может использовать файл или базу данных как источник данных."},{en:"Choose the data source before you open the table.",ru:"Выбери источник данных, прежде чем открывать таблицу."}]}),
     W("uniform","[ˈjuːnɪfɔːm]","единообразный (унифицированный)",{def:"Единообразный, унифицированный. Одинаковый по структуре независимо от источника.",plain:"Когда данные из разных источников выглядят одинаково (одни и те же поля и форматы), с ними удобно работать одним и тем же способом.",ruAcc:["единообразный", "унифицированный", "единообразный (унифицированный)"],senses:[{ru:"форма (одежда)",note:"существительное uniform — школьная или военная форма"}],examples:[{en:"All the records have a uniform structure.",ru:"У всех записей единообразная структура."},{en:"A uniform format makes the data easy to read.",ru:"Единый формат делает данные удобными для чтения."}]}),
     W("grid","[ɡrɪd]","сетка (грид)",{def:"Сетка, грид. Компонент, показывающий данные в строках и столбцах.",plain:"Окно-таблица в программе: видишь записи построчно, можешь щёлкнуть по ячейке и изменить значение.",ruAcc:["сетка", "грид", "сетка (грид)"],senses:[{ru:"электросеть",note:"вне IT — a power grid, сеть линий электропередачи"}],examples:[{en:"The grid shows all the records of the table.",ru:"Грид показывает все записи таблицы."},{en:"Click a cell of the grid to change the value.",ru:"Щёлкни по ячейке грида, чтобы изменить значение."}]}),
     W("crosstabs","[ˈkrɒstæbz]","перекрёстные таблицы",{def:"Перекрёстные таблицы. Значения одного поля по строкам, другого по столбцам, на пересечении итог.",plain:"Как таблица умножения: слева одни значения, сверху другие, а в клетке на пересечении — итог. Например, строки — группы, столбцы — предметы, в клетке — средняя оценка.",enAcc:["crosstabs", "crosstab", "cross tabs"],examples:[{en:"A crosstabs report shows the groups in rows and the subjects in columns.",ru:"Отчёт-перекрёстная таблица показывает группы по строкам, а предметы по столбцам."},{en:"Crosstabs are useful when you need totals for two fields.",ru:"Перекрёстные таблицы полезны, когда нужны итоги по двум полям."}]}),
     W("metadata","[ˈmetədeɪtə]","метаданные",{def:"Метаданные. Данные о данных: имена таблиц, типы полей, связи.",plain:"Описание самих данных: как называются таблицы, какого типа поля, как таблицы связаны. Как карточка в библиотеке: не сама книга, а сведения о ней.",examples:[{en:"Metadata tells you the name and the type of every field.",ru:"Метаданные говорят, как называется каждое поле и какого оно типа."},{en:"The repository stores the metadata of the whole database.",ru:"Репозиторий хранит метаданные всей базы данных."}]}),
     W("repository","[rɪˈpɒzətri]","репозиторий (хранилище)",{def:"Репозиторий, хранилище. Централизованное хранение кода, метаданных, объектов.",plain:"Общий «склад», где в одном месте лежат код проекта, метаданные и объекты, и все участники работают с одной и той же версией.",ruAcc:["репозиторий", "хранилище", "репозиторий (хранилище)"],examples:[{en:"The team keeps all its code in one repository.",ru:"Команда хранит весь свой код в одном репозитории."},{en:"A repository stores the objects and the metadata of the project.",ru:"Репозиторий хранит объекты и метаданные проекта."}]}),
     W("file table","[faɪl ˈteɪbl]","файловая таблица",{def:"Файловая таблица. Таблица в отдельном файле (dBase, Paradox).",plain:"Старый способ хранения: каждая таблица — это отдельный файл на диске, и вся база данных состоит из набора таких файлов.",examples:[{en:"A file table is a table that lives in its own file.",ru:"Файловая таблица — это таблица, которая лежит в отдельном файле."},{en:"dBase and Paradox keep each file table on the disk.",ru:"dBase и Paradox хранят каждую файловую таблицу на диске."}]}),
     W("event","[ɪˈvent]","событие",{def:"Событие. Действие (клик, изменение записи), на которое реагирует обработчик.",plain:"Что-то случилось — и программа может на это отреагировать: пользователь нажал кнопку, запись изменилась. Для каждого события пишут обработчик — кусочек кода, который сработает в ответ.",senses:[{ru:"мероприятие, происшествие",note:"вне IT — публичное мероприятие или важное происшествие"}],examples:[{en:"A click on the button is an event.",ru:"Щелчок по кнопке — это событие."},{en:"The program waits for an event and then runs the code.",ru:"Программа ждёт события, а затем запускает код."}]}),
     W("COM (Component Object Model)","[ˌsiː əʊ ˈem] [kəmˈpəʊnənt ˈɒbdʒɪkt ˈmɒdl]","модель компонентных объектов",{def:"Модель компонентных объектов. Технология Microsoft для взаимодействия компонентов на разных языках.",plain:"Общие правила, по которым компоненты, написанные на разных языках, могут работать вместе: один вызывает другой, не зная, на чём тот написан.",examples:[{en:"COM lets components written in different languages work together.",ru:"COM позволяет работать вместе компонентам, написанным на разных языках."},{en:"Many old Windows programs use COM.",ru:"Многие старые программы для Windows используют COM."}]})
   ]},
   {id:"transactions",title:"Транзакции",words:[
     W("commit","[kəˈmɪt]","фиксация транзакции",{def:"Фиксация транзакции. Окончательно сохраняет изменения.",plain:"Команда «всё, сохраняем окончательно». До commit изменения можно отменить, после — они уже записаны в базу.",ruAcc:["фиксация транзакции", "фиксация", "зафиксировать"],senses:[{ru:"совершать; брать обязательство",note:"to commit a crime — совершить преступление; to commit to something — взять на себя обязательство"}],examples:[{en:"Commit the transaction to save all the changes.",ru:"Зафиксируй транзакцию, чтобы сохранить все изменения."},{en:"After the commit, the changes cannot be taken back.",ru:"После фиксации изменения уже нельзя вернуть."}]}),
     W("abort","[əˈbɔːt]","прерывание",{def:"Прерывание. Аварийное завершение операции или транзакции.",plain:"Операцию остановили из-за ошибки или по команде, не доведя до конца. Изменения при этом обычно отменяются.",note:"Не путай: interrupt — прерывание, после которого программа продолжает работу; abort — аварийное завершение.",examples:[{en:"The system will abort the transaction if an error happens.",ru:"Система прервёт транзакцию, если произойдёт ошибка."},{en:"Press the button to abort the operation.",ru:"Нажми кнопку, чтобы прервать операцию."}]}),
     W("roll back","[rəʊl bæk]","откат",{def:"Откат. Отмена изменений и возврат к состоянию до транзакции.",plain:"Кнопка «вернуть как было»: все изменения внутри транзакции отменяются, и база данных возвращается к состоянию до её начала.",note:"Существительное пишут слитно — rollback.",enAcc:["roll back", "rollback", "roll-back"],examples:[{en:"Roll back the transaction if you made a mistake.",ru:"Откати транзакцию, если ты ошибся."},{en:"The system will roll back all the changes after a failure.",ru:"Система откатит все изменения после сбоя."}]})
   ]},
   {id:"env",title:"Среда и разработка",words:[
     W("runtime","[ˈrʌntaɪm]","время выполнения",{def:"Время выполнения. Период работы программы или среда её запуска.",plain:"Либо момент, когда программа работает («ошибка во время выполнения»), либо готовая среда, которая нужна, чтобы программа вообще запустилась.",examples:[{en:"The error appears only at runtime.",ru:"Ошибка появляется только во время выполнения."},{en:"The program needs a runtime to start on this computer.",ru:"Для запуска на этом компьютере программе нужна среда выполнения."}]}),
     W("SQL (Structured Query Language)","[ˌes kjuː ˈel] / [ˈsiːkwəl] [ˈstrʌktʃəd ˈkwɪəri ˈlæŋɡwɪdʒ]","язык структурированных запросов",{def:"Язык структурированных запросов. Стандартный язык работы с реляционными БД.",plain:"Язык, на котором «разговаривают» с базой данных: SELECT — достать данные, INSERT — добавить, UPDATE — изменить, DELETE — удалить.",examples:[{en:"SQL is the standard language for a relational database.",ru:"SQL — стандартный язык для реляционной базы данных."},{en:"Write a short SQL query to find all the students.",ru:"Напиши короткий запрос на SQL, чтобы найти всех студентов."}]}),
     W("DBMS (database management system)","[ˌdiː biː em ˈes] [ˈdeɪtəbeɪs ˈmænɪdʒmənt ˈsɪstəm]","СУБД (система управления базами данных)",{def:"СУБД, система управления базами данных (MySQL, PostgreSQL).",plain:"«Пульт управления» базами данных. Через СУБД пользователи и приложения общаются с данными, а не лезут в файлы напрямую.",ruAcc:["СУБД", "система управления базами данных", "система управления базой данных"],examples:[{en:"The DBMS checks every query before it runs it.",ru:"СУБД проверяет каждый запрос, прежде чем выполнить его."},{en:"The DB engine is the main part of a DBMS.",ru:"Механизм БД — основная часть СУБД."}]}),
     W("DB application","[ˌdiː ˈbiː ˌæplɪˈkeɪʃn]","приложение БД",{def:"Приложение БД. Программа с интерфейсом для работы с базой.",plain:"Программа, через которую человек работает с базой данных: смотрит записи, добавляет новые, ищет нужное — не думая о том, как всё устроено внутри.",ruAcc:["приложение БД", "приложение базы данных"],examples:[{en:"A DB application shows the data in a window and lets the user change it.",ru:"Приложение БД показывает данные в окне и позволяет пользователю их менять."},{en:"The college has its own DB application for student records.",ru:"В колледже есть своё приложение БД для данных о студентах."}]}),
     W("provide","[prəˈvaɪd]","предоставлять (обеспечивать)",{def:"Предоставлять, обеспечивать.",plain:"Давать что-то нужное: возможности, доступ, данные. Часто встречается в конструкции provide something to someone.",ruAcc:["предоставлять", "обеспечивать", "предоставлять (обеспечивать)"],examples:[{en:"The server must provide the data to every client.",ru:"Сервер должен предоставлять данные каждому клиенту."},{en:"This library provides a function for sorting arrays.",ru:"Эта библиотека предоставляет функцию для сортировки массивов."}]}),
     W("palette","[ˈpælət]","палитра",{def:"Палитра. Панель IDE с готовыми компонентами для перетаскивания на форму.",plain:"Как палитра у художника, только вместо красок — готовые компоненты (кнопки, поля, таблицы), которые мышью переносят на экранную форму.",senses:[{ru:"палитра красок",note:"вне IT — набор красок художника или набор цветов"}],examples:[{en:"Choose a button on the palette and drag it to the form.",ru:"Выбери кнопку на палитре и перетащи её на форму."},{en:"The palette of this IDE has hundreds of components.",ru:"В палитре этой IDE сотни компонентов."}]}),
     W("imbed (embed)","[ɪmˈbed]","встраивать (внедрять)",{def:"Встраивать, внедрять один элемент или код в другой.",plain:"Поместить одну вещь внутрь другой так, чтобы она стала её частью: картинку в документ, небольшую базу данных в программу.",note:"Вариант imbed встречается реже, чаще пишут embed.",enAcc:["imbed (embed)", "imbed", "embed"],ruAcc:["встраивать", "внедрять", "встраивать (внедрять)"],examples:[{en:"You can embed a picture into a document.",ru:"Картинку можно встроить в документ."},{en:"The program embeds a small database inside itself.",ru:"Программа встраивает в себя небольшую базу данных."}]}),
     W("platform","[ˈplætfɔːm]","платформа",{def:"Платформа. Среда работы программы: ОС, оборудование, фреймворк.",plain:"То, на чём программа запускается и от чего зависит: операционная система, тип компьютера, набор готовых библиотек.",senses:[{ru:"платформа (на вокзале)",note:"вне IT — перрон, возвышение"}],examples:[{en:"Windows is a platform for many programs.",ru:"Windows — платформа для многих программ."},{en:"The program runs on every platform.",ru:"Программа работает на любой платформе."}]}),

/* ---------- Утилиты ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var QCLASS="[«»“”„‟\"'‘’‚`´‹›]";
var QRE=new RegExp(QCLASS,'g');
function norm(s){
  return String(s).toLowerCase().replace(/ё/g,'е')
    .replace(QRE,' ').replace(/[–—−]/g,'-')
    .replace(/\s*([\/,])\s*/g,'$1').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  var m=a.length,n=b.length,p=[],i,j;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){var c=[i];for(j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1))}p=c}
  return p[n];
}
function gradeFor(errors){return errors<=1?5:errors===2?4:errors===3?3:2}
function pluralOshibok(n){
  var m10=n%10,m100=n%100;
  if(m10===1&&m100!==11)return 'ошибка';
  if(m10>=2&&m10<=4&&(m100<10||m100>=20))return 'ошибки';
  return 'ошибок';
}
function pluralSlov(n){
  var m10=n%10,m100=n%100;
  if(m10===1&&m100!==11)return 'слово';
  if(m10>=2&&m10<=4&&(m100<10||m100>=20))return 'слова';
  return 'слов';
}

/* ---------- Проверка ответа ---------- */
function parenSplit(s){var m=s.match(/^(.*?)\s*\(([^)]*)\)\s*$/);return m?{main:m[1].trim(),inner:m[2].trim()}:null}
function acceptEn(w){
  if(w.enAcc) return w.enAcc;
  var p=parenSplit(w.en);
  return p?[w.en,p.main,p.inner]:[w.en];
}
function acceptRu(w,strict){
  var main=w.ru.replace(/\s*\([^)]*\)/g,'').replace(/\s+/g,' ').trim();
  var list=[w.ru,main];
  if(!strict){
    if(w.ruAcc) list=list.concat(w.ruAcc);
    else list=list.concat(main.split(/\s*[\/,]\s*/));
  }
  if(/«/.test(w.ru)) list=list.concat(list.map(function(s){return s.replace(/^программа\s+/i,'')}));
  return list;
}
function judge(q,text,strict){
  var cands=(q.dir==='ru2en'?acceptEn(q.w):acceptRu(q.w,strict))
    .map(function(s){return s.trim()}).filter(Boolean);
  var n=norm(text);
  var ok=cands.some(function(c){return norm(c)===n});
  var best=cands[0],bd=1e9;
  cands.forEach(function(c){var d=lev(norm(c),n);if(d<bd){bd=d;best=c}});
  return {ok:ok,best:best};
}
function nc(ch){return ch.toLowerCase().replace('ё','е')}
function findClozeExample(w){
  if(!w.examples||!w.examples.length)return null;
  var cands=acceptEn(w).slice().sort(function(a,b){return b.length-a.length});
  var matches=[];
  w.examples.forEach(function(ex){
    var hay=ex.en.toLowerCase();
    for(var c=0;c<cands.length;c++){
      var needle=cands[c].toLowerCase();
      if(!needle)continue;
      var idx=hay.indexOf(needle);
      if(idx>-1){matches.push({example:ex,start:idx,end:idx+needle.length,matched:ex.en.slice(idx,idx+needle.length)});break}
    }
  });
  if(!matches.length)return null;
  return matches[Math.floor(Math.random()*matches.length)];
}
function pickDistractors(correctValue,sourcePool,globalPool,sideFn,n){
  var seen=new Set([norm(correctValue)]);
  var out=[];
  [sourcePool,globalPool].forEach(function(pool){
    if(out.length>=n)return;
    var cand=shuffle(pool.slice());
    for(var i=0;i<cand.length&&out.length<n;i++){
      var val=sideFn(cand[i]);
      var key=norm(val);
      if(val&&!seen.has(key)){seen.add(key);out.push(val)}
    }
  });
  return out;
}
function diff(user,target){
  var a=Array.from(user.replace(QRE,' ').replace(/\s+/g,' ').trim()),
      b=Array.from(target.replace(QRE,'').replace(/\s+/g,' ').trim());
  var n=a.length,m=b.length,i,j,dp=[];
  for(i=0;i<=n;i++){dp.push(new Array(m+1).fill(0))}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--){
    dp[i][j]=nc(a[i])===nc(b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  }
  var ah='',bh='';i=0;j=0;
  while(i<n&&j<m){
    if(nc(a[i])===nc(b[j])){ah+=esc(a[i]);bh+=esc(b[j]);i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){ah+='<mark class="bad">'+esc(a[i])+'</mark>';i++}
    else{bh+='<mark class="miss">'+esc(b[j])+'</mark>';j++}
  }
  while(i<n){ah+='<mark class="bad">'+esc(a[i])+'</mark>';i++}
  while(j<m){bh+='<mark class="miss">'+esc(b[j])+'</mark>';j++}
  return {ah:ah,bh:bh};
}

var KEY='slovarny-diktant-stats-v2';
var stats={};
try{stats=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){stats={}}
function saveStats(){try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}}
function isWeak(w){var s=stats[w.id];return !!(s&&s.miss>0&&s.streak<2)}
function weakWords(){return WORDS.filter(isWeak)}
function record(w,ok){
  var s=stats[w.id]||(stats[w.id]={miss:0,streak:0});
  if(ok){s.streak++}else{s.miss++;s.streak=0}
  saveStats();
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)||!text)return false;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=0.95;
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){return false}
}

var selection=new Set();
function selWordIds(){return Array.from(selection)}
function selPool(){return selWordIds().map(function(id){return WORDS_BY_ID[id]}).filter(Boolean)}
function setIdsOf(set){return set.words.map(function(w){return w.id})}
function sectionIdsOf(sec){
  var ids=[];sec.sets.forEach(function(set){ids=ids.concat(setIdsOf(set))});return ids;
}
function groupState(ids){
  var all=ids.every(function(id){return selection.has(id)});
  var some=ids.some(function(id){return selection.has(id)});
  return all?'all':(some?'some':'none');
}
function toggleGroup(ids){
  var st=groupState(ids);
  if(st==='all'){ids.forEach(function(id){selection.delete(id)})}
  else{ids.forEach(function(id){selection.add(id)})}
}
function selectionSummary(){
  if(!selection.size)return '';
  var secSet={},setSet={},wordOnly=0;
  selWordIds().forEach(function(id){
    var w=WORDS_BY_ID[id];
    var set=SET_BY_ID[w.setId].set;
    var full=groupState(setIdsOf(set))==='all';
    if(full) setSet[w.setId]=1; else wordOnly++;
  });
  Object.keys(setSet).forEach(function(setId){
    var sec=SET_BY_ID[setId].section;
    if(groupState(sectionIdsOf(sec))==='all') secSet[sec.id]=1;
  });
  var parts=[];
  var secCount=Object.keys(secSet).length;
  var setCount=Object.keys(setSet).filter(function(setId){return !secSet[SET_BY_ID[setId].section.id]}).length;
  if(secCount) parts.push(secCount+' '+(secCount===1?'раздел':'раздела(ов)'));
  if(setCount) parts.push(setCount+' '+(setCount===1?'набор':'набора(ов)'));
  if(wordOnly) parts.push(wordOnly+' '+pluralSlov(wordOnly));
  return parts.join(', ');
}

    area.className='grid study study-'+(mode==='all'?'none':mode.slice(5));
    area.innerHTML=list.length?list.map(function(w){return wordCardHTML(w,{mode:mode})}).join(''):'<p class="empty">Ничего не найдено. Попробуй другое слово.</p>';
    note.textContent='Найдено слов: '+list.length+'.';
    return;
  }

  if(navPath.length===0){
    area.className='ggrid';
    area.innerHTML=SECTIONS.map(sectionCardHTML).join('');
    markIndeterminate(area);
    note.textContent='Выбери раздел, чтобы открыть его наборы слов.';
    return;
  }
  if(navPath.length===1){
    var sec=SECTION_BY_ID[navPath[0]];
    area.className='ggrid';
    area.innerHTML=sec.sets.map(setCardHTML).join('');
    markIndeterminate(area);
    note.textContent='Выбери набор, чтобы открыть слова и подучить их перед диктантом.';
    return;
  }
  var set=SET_BY_ID[navPath[1]].set;
  area.className='grid study study-'+(mode==='all'?'none':mode.slice(5));
  area.innerHTML=set.words.map(function(w){return wordCardHTML(w,{mode:mode})}).join('');
  note.textContent=mode==='all'
    ?'Показано слов: '+set.words.length+'.'
    :'Нажми на карточку, чтобы открыть скрытую сторону. Показано слов: '+set.words.length+'.';
}
if(SECTIONS.length>1||true){/* class cleanup below handles 'none' */}
function fixModeClass(){
  var area=$('#cardsArea');
  area.classList.remove('study-none');
}

$('#q').addEventListener('input',function(){searchQ=this.value.trim();renderCardsArea()});
$('#mode').addEventListener('change',renderCardsArea);

$('#cardsArea').addEventListener('click',function(e){
  var spk=e.target.closest('[data-speak]');
  if(spk){speak(spk.dataset.speak);return}
  var det=e.target.closest('[data-detoggle]');
  if(det){
    var wid=parseInt(det.dataset.detoggle,10);
    if(detailsOpen.has(wid))detailsOpen.delete(wid);else detailsOpen.add(wid);
    renderCardsArea();
    return;
  }
  var wcheck=e.target.closest('[data-wcheck]');
  if(wcheck){
    var id=parseInt(wcheck.dataset.wcheck,10);
    if(wcheck.checked)selection.add(id);else selection.delete(id);
    renderSelBar();renderCardsArea();
    return;
  }
  var gcheck=e.target.closest('[data-gcheck]');
  if(gcheck){
    var ids=gcheck.dataset.gcheck.split('|').map(Number);
    toggleGroup(ids);
    renderSelBar();renderCardsArea();
    return;
  }
  var navsec=e.target.closest('[data-navsec]');
  if(navsec){navPath=[navsec.dataset.navsec];renderCardsArea();return}
  var navset=e.target.closest('[data-navset]');
  if(navset){navPath=[navPath[0],navset.dataset.navset];renderCardsArea();return}
  var card=e.target.closest('.card');
  if(card && $('#cardsArea').classList.contains('study')){card.classList.toggle('open')}
});
$('#cardsArea').addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ')return;
  var card=e.target.closest('.card');
  if(card && e.target===card && $('#cardsArea').classList.contains('study')){e.preventDefault();card.classList.toggle('open');return}
  var g=e.target.closest('.gcard');
  if(g && e.target===g){e.preventDefault();g.click();}
});

/* ---------- Диктант ---------- */
var root=$('#dictation');
var testOpts={source:'all',count:'10',dir:'mixed',strict:false,exercise:'dictation'};
var S=null;

function poolForSource(src){
  if(src==='weak')return weakWords();
  if(src==='selected')return selPool();
  return WORDS;
}
function poolForExercise(){
  var pool=poolForSource(testOpts.source);
  if(testOpts.exercise==='cloze')pool=pool.filter(function(w){return !!findClozeExample(w)});
  if(testOpts.exercise==='sentence')pool=pool.filter(function(w){return w.examples&&w.examples.length});
  return pool;
}
function sourceLabel(src,n){
  if(src==='weak')return 'Слабые слова ('+n+')';
  if(src==='selected')return 'Выбранное ('+n+')';
  return 'Все слова ('+n+')';
}
function chip(name,val,label,disabled){
  return '<label class="chip"><input type="radio" name="'+name+'" value="'+val+'"'+
    (String(testOpts[name])===val?' checked':'')+(disabled?' disabled':'')+'><span>'+esc(label)+'</span></label>';
}
function srcChip(val,label,n,disabled){
  return '<label class="chip srcchip"><input type="radio" name="source" value="'+val+'"'+
    (testOpts.source===val?' checked':'')+(disabled?' disabled':'')+
    '><span>'+esc(label)+'<small>'+n+' '+pluralSlov(n)+'</small></span></label>';
}
function renderDictation(){
  document.body.dataset.tab='test';renderSelBar();
  S=null;
  var weak=weakWords(), weakN=weak.length, selN=selection.size;
  if(testOpts.source==='weak'&&!weakN)testOpts.source='all';
  if(testOpts.source==='selected'&&!selN)testOpts.source='all';

  var pool=poolForExercise();
  var countOpts=[10,20].filter(function(n){return n<pool.length});
  var avail=countOpts.map(String).concat(['all']);
  if(avail.indexOf(testOpts.count)===-1)testOpts.count='all';

  var selInfo=selN?('<p class="note">Выбрано сейчас: '+selectionSummary()+'. <button class="link" id="goCards" type="button" style="padding:0">Изменить выбор</button></p>'):'';

  var exNote={
    dictation:'Ошибкой считается каждое слово, которое переведено неверно или с опечаткой. В конце покажу процент верных ответов. Регистр букв, «ё» вместо «е» и вид кавычек не считаются ошибкой.',
    choice:'Ошибкой считается каждый неверно выбранный вариант перевода. В конце покажу процент верных ответов.',
    cloze:'Нужно вписать по-английски слово, пропущенное в примере предложения. Опечатки считаются ошибкой, как в диктанте.',
    sentence:'Показываю русское предложение — пишешь его по-английски целиком. Регистр, знаки препинания и вид кавычек не важны; при расхождении покажу, где именно. Верным считается совпадение с примером из карточки.'
  }[testOpts.exercise];

  root.innerHTML=
    '<div class="panel">'+
    '<h2>Новый диктант</h2>'+
    '<div class="srcbox"><fieldset style="margin:0"><legend>Какие слова повторяем</legend>'+
      srcChip('all','Все слова',WORDS.length)+
      srcChip('weak','Слабые слова',weakN,!weakN)+
      srcChip('selected','Выбранное',selN,!selN)+
    '</fieldset>'+selInfo+'</div>'+
    '<fieldset><legend>Тип упражнения</legend>'+
      chip('exercise','dictation','Диктант (впиши перевод)')+
      chip('exercise','choice','Выбор перевода из 4 вариантов')+
      chip('exercise','cloze','Пропуск в предложении (cloze)')+
      chip('exercise','sentence','Перевод предложения')+
    '</fieldset>'+
    '<fieldset><legend>Сколько слов</legend>'+
      countOpts.map(function(n){return chip('count',String(n),String(n))}).join('')+
      chip('count','all','Все ('+pool.length+')')+
    '</fieldset>'+
    ((testOpts.exercise==='cloze'||testOpts.exercise==='sentence')?'':(
      '<fieldset><legend>Что переводить</legend>'+
      chip('dir','mixed','Вперемешку')+chip('dir','ru2en','Русский → английский')+chip('dir','en2ru','Английский → русский')+
      '</fieldset>'
    ))+
    (testOpts.exercise==='dictation'?
      '<label class="check"><input type="checkbox" id="strict"'+(testOpts.strict?' checked':'')+'><span>Строго: русский перевод писать целиком, со всеми вариантами через запятую или косую черту</span></label>'
      :'')+
    '<p class="note">'+exNote+'</p>'+
    (pool.length?'<div class="row"><button class="btn primary" id="start">Начать диктант</button></div>'
      :'<p class="note">В этой группе пока нет подходящих слов для этого режима.</p>')+
    '</div>'+
    (Object.keys(stats).length?'<p><button class="link" id="resetStats">Сбросить статистику слабых слов</button></p>':'');
}
function startSession(){
  var pool=poolForExercise();
  var list=shuffle(pool.slice());
  var n=testOpts.count==='all'?list.length:Math.min(parseInt(testOpts.count,10),list.length);
  S={
    queue:list.slice(0,n).map(function(w){
      return {w:w,dir:testOpts.dir==='mixed'?(Math.random()<0.5?'ru2en':'en2ru'):testOpts.dir};
    }),
    i:0,errors:0,results:[],last:null,strict:testOpts.strict
  };
  renderQuestion();
}
function progressHTML(upto){
  var total=S.queue.length;
  return '<div class="prog"><span>Слово '+(S.i+1)+' из '+total+'</span>'+
    '<span>Ошибок: '+S.errors+'</span></div>'+
    '<div class="bar"><i style="width:'+Math.round(upto/total*100)+'%"></i></div>';
}
function renderQuestion(){
  var q=S.queue[S.i];
  if(testOpts.exercise==='choice'){renderChoiceQuestion(q);return}
  if(testOpts.exercise==='cloze'){renderClozeQuestion(q);return}
  if(testOpts.exercise==='sentence'){renderSentenceQuestion(q);return}
  var toEn=q.dir==='ru2en';
  root.innerHTML=
    progressHTML(S.i)+
    '<div class="panel">'+
      '<p class="dirlabel">'+(toEn?'Переведи на английский':'Переведи на русский')+'</p>'+
      '<p class="prompt" lang="'+(toEn?'ru':'en')+'">'+esc(toEn?q.w.ru:q.w.en)+'</p>'+
      '<form id="af" autocomplete="off">'+
        '<label class="sr" for="ans">Твой перевод</label>'+
        '<input id="ans" class="answer" lang="'+(toEn?'en':'ru')+'" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" autocomplete="off">'+
        '<div class="row"><button class="btn primary" type="submit">Проверить</button>'+
        '<button class="btn" type="button" id="idk">Не знаю</button></div>'+
      '</form>'+
    '</div>'+
    '<p><button class="link" id="quit">Закончить диктант</button></p>';
  $('#ans').focus();
}
function renderChoiceQuestion(q){
  var toEn=q.dir==='ru2en';
  var correct=toEn?q.w.en:q.w.ru;
  var sideFn=function(w){return toEn?w.en:w.ru};
  var sourcePool=poolForExercise();
  var distractors=pickDistractors(correct,sourcePool,WORDS,sideFn,3);
  var options=shuffle([correct].concat(distractors));
  S._correctChoiceText=correct;
  root.innerHTML=
    progressHTML(S.i)+
    '<div class="panel">'+
      '<p class="dirlabel">'+(toEn?'Выбери перевод на английский':'Выбери перевод на русский')+'</p>'+
      '<p class="prompt" lang="'+(toEn?'ru':'en')+'">'+esc(toEn?q.w.ru:q.w.en)+'</p>'+
      '<div class="choices">'+
        options.map(function(opt){
          return '<button type="button" class="choiceBtn" data-choice="'+esc(opt)+'" data-correct="'+(opt===correct?'1':'0')+'">'+esc(opt)+'</button>';
        }).join('')+
      '</div>'+
      '<div class="row"><button class="btn" type="button" id="idk">Не знаю</button></div>'+
    '</div>'+
    '<p><button class="link" id="quit">Закончить диктант</button></p>';
}
function renderClozeQuestion(q){
  var cz=findClozeExample(q.w);
  if(!cz){ // защитный случай, если слово как-то оказалось без подходящего примера
    S._cz=null;
    recordAnswer(false,'',q.w.en);
    return;
  }
  var sentence=cz.example.en;
  var masked=esc(sentence.slice(0,cz.start))+'<span class="blank"></span>'+esc(sentence.slice(cz.end));
  S._cz=cz;
  root.innerHTML=
    progressHTML(S.i)+
    '<div class="panel">'+
      '<p class="dirlabel">Впиши пропущенное английское слово или фразу</p>'+
      '<p class="prompt cloze" lang="en">'+masked+'</p>'+
      '<p class="clozeru" lang="ru">'+esc(cz.example.ru)+'</p>'+
      '<form id="af" autocomplete="off">'+
        '<label class="sr" for="ans">Пропущенное слово</label>'+
        '<input id="ans" class="answer" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" autocomplete="off">'+
        '<div class="row"><button class="btn primary" type="submit">Проверить</button>'+
        '<button class="btn" type="button" id="idk">Не знаю</button></div>'+
      '</form>'+
    '</div>'+
    '<p><button class="link" id="quit">Закончить диктант</button></p>';
  $('#ans').focus();
}
function sentNorm(s){
  return norm(s).replace(/[.,;:!?()—\-]/g,' ').replace(/\s+/g,' ').trim();
}
function renderSentenceQuestion(q){
  var exs=q.w.examples, ex=exs[Math.floor(Math.random()*exs.length)];
  S._sent=ex;
  root.innerHTML=
    progressHTML(S.i)+
    '<div class="panel">'+
      '<p class="dirlabel">Переведи предложение на английский (слово: <b lang="en">'+esc(q.w.en)+'</b>)</p>'+
      '<p class="prompt cloze" lang="ru">'+esc(ex.ru)+'</p>'+
      '<form id="af" autocomplete="off">'+
        '<label class="sr" for="ans">Перевод предложения</label>'+
        '<input id="ans" class="answer" lang="en" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" autocomplete="off">'+
        '<div class="row"><button class="btn primary" type="submit">Проверить</button>'+
        '<button class="btn" type="button" id="idk">Не знаю</button></div>'+
      '</form>'+
    '</div>'+
    '<p><button class="link" id="quit">Закончить диктант</button></p>';
  $('#ans').focus();
}
function recordAnswer(ok,userText,bestText){
  var q=S.queue[S.i];
  if(!ok)S.errors++;
  record(q.w,ok);
  var item={q:q,ok:ok,text:userText||'',best:bestText};
  S.results.push(item);
  S.last=item;
  renderResult();
}
function answer(text,gaveUp){
  var q=S.queue[S.i];
  var res=gaveUp?{ok:false,best:null}:judge(q,text,S.strict);
  recordAnswer(res.ok,gaveUp?'':text.trim(),res.best);
}
function renderResult(){
  var r=S.last, last=S.i===S.queue.length-1;
  var cmp='';
  if(!r.ok&&r.text){
    if(testOpts.exercise==='choice'){
      cmp='<div class="cmp"><div><b>Ты выбрал:</b> '+esc(r.text)+'</div><div><b>Правильно:</b> '+esc(r.best||'')+'</div></div>';
    } else {
      var d=diff(r.text,r.best||'');
      cmp='<div class="cmp"><div><b>Ты написал:</b> '+d.ah+'</div><div><b>Правильно:</b> '+d.bh+'</div></div>';
    }
  }
  root.innerHTML=
    progressHTML(S.i+1)+
    '<div class="panel">'+
      '<div class="verdict '+(r.ok?'ok':'bad')+'">'+(r.ok?'✓ Верно':(r.text?'✕ Ошибка':'✕ Не знаю'))+'</div>'+
      wordCardHTML(r.q.w,{full:true})+cmp+
      '<div class="row"><button class="btn primary" id="next">'+(last?'Показать оценку':'Дальше')+'</button></div>'+
    '</div>'+
    '<p><button class="link" id="quit">Закончить диктант</button></p>';
  $('#next').focus();
}
function renderFinal(){
  var total=S.queue.length, pct=Math.round((total-S.errors)/total*100);
  var verdictWord=pct>=90?'Отлично':pct>=70?'Хорошо':pct>=50?'Неплохо':'Нужно повторить';
  var wrong=S.results.filter(function(r){return !r.ok});
  var html='<div class="panel final">'+
    '<p class="gradeword">'+verdictWord+'</p>'+
    '<div class="grade" style="font-size:clamp(4rem,20vw,6.5rem)" aria-label="Верно '+pct+' процентов">'+pct+'%</div>'+
    '<p>Верно '+(total-S.errors)+' из '+total+' · '+S.errors+' '+pluralOshibok(S.errors)+'</p>'+
    '<div class="row" style="justify-content:center">'+
      (wrong.length?'<button class="btn primary" id="retry">Повторить ошибки</button>':'')+
      '<button class="btn'+(wrong.length?'':' primary')+'" id="again">Новый диктант</button>'+
    '</div></div>';
  if(wrong.length){
    html+='<h2 style="margin-top:24px">Над чем поработать</h2><div class="misses">'+
      wrong.map(function(r){
        return '<div class="miss-item">'+
          (r.text?'<p class="said">Ты написал: '+esc(r.text)+'</p>':'<p class="said">Не знал</p>')+
          wordCardHTML(r.q.w,{full:true})+'</div>';
      }).join('')+'</div>';
  }
  root.innerHTML=html;
  window.scrollTo(0,0);
  var b=$('#retry')||$('#again'); if(b)b.focus();
}

root.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='source'){testOpts.source=t.value;testOpts.count='10';renderDictation();return}
  if(t.name==='exercise'){testOpts.exercise=t.value;testOpts.count='10';renderDictation();return}
  if(t.name==='count'||t.name==='dir')testOpts[t.name]=t.value;
  if(t.id==='strict')testOpts.strict=t.checked;
});
root.addEventListener('submit',function(e){
  e.preventDefault();
  if(!S||e.target.id!=='af')return;
  var v=$('#ans').value;
  if(!v.trim()){$('#ans').focus();return}
  if(testOpts.exercise==='cloze'){
    var res=judge({w:S.queue[S.i].w,dir:'ru2en'},v,false);
    recordAnswer(res.ok,v.trim(),res.best);
  } else if(testOpts.exercise==='sentence'){
    recordAnswer(sentNorm(v)===sentNorm(S._sent.en),v.trim(),S._sent.en);
  } else {
    answer(v,false);
  }
});
root.addEventListener('click',function(e){
  var spk=e.target.closest('[data-speak]');
  if(spk){speak(spk.dataset.speak);return}
  var choiceBtn=e.target.closest('[data-choice]');
  if(choiceBtn){
    recordAnswer(choiceBtn.dataset.correct==='1',choiceBtn.dataset.choice,S._correctChoiceText);
    return;
  }
  var id=e.target.id;
  if(id==='start'){startSession()}
  else if(id==='idk'){
    if(testOpts.exercise==='choice'){recordAnswer(false,'',S._correctChoiceText)}
    else if(testOpts.exercise==='cloze'){recordAnswer(false,'',(S._cz&&S._cz.matched)||S.queue[S.i].w.en)}
    else if(testOpts.exercise==='sentence'){recordAnswer(false,'',S._sent.en)}
    else{answer('',true)}
  }
  else if(id==='next'){S.i++;if(S.i>=S.queue.length)renderFinal();else renderQuestion()}
  else if(id==='quit'||id==='again'){renderDictation()}
  else if(id==='retry'){
    var wrongWords=S.results.filter(function(r){return !r.ok}).map(function(r){return r.q.w.id});
    selection=new Set(wrongWords);
    testOpts.source='selected';testOpts.count='all';
    renderDictation();
  }
  else if(id==='resetStats'){stats={};saveStats();renderDictation()}
  else if(id==='goCards'){showTab('cards')}
});

/* ---------- Вкладки ---------- */
function showTab(name){
  document.body.dataset.tab=name;
  $('#tab-cards').hidden=(name!=='cards');
  $('#tab-test').hidden=(name!=='test');
  ['cards','test'].forEach(function(n){
    var t=$('#t-'+n); t.setAttribute('aria-selected',n===name?'true':'false'); t.classList.toggle('on',n===name);
  });
  if(name==='test' && !S) renderDictation();
  renderSelBar();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){showTab(b.dataset.tab)});
});

/* ---------- Запуск ---------- */
$('#subline').textContent=WORDS.length+' слов: IT, общий английский, колледж';
document.body.dataset.tab='cards';
renderCardsArea();
renderDictation();
showTab('cards');

})();
